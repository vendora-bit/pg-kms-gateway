name: Bug report
description: Report a reproducible problem without plaintext, keys or database credentials.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never include plaintext, ciphertext, KMS credentials, bundles, DSNs or production schema details. Use private vulnerability reporting for security issues."
  - type: input
    id: version
    attributes:
      label: pg-kms-gateway version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and sanitized logs
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal policy/configuration reproduction
      description: "Use placeholder names and a mock KMS URI."
    validations:
      required: true
