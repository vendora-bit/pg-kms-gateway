replicaCount: 2

image:
  repository: ghcr.io/vendora-bit/pg-kms-gateway
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 5432

config:
  upstreamAddress: "postgres.database.svc:5432"
  upstreamTLS: true
  upstreamServerName: "postgres.database.svc"
  kmsProvider: vault-transit
  kmsKeyRef: pg-kms-gateway
  vaultAddress: "https://vault.security.svc:8200"
  vaultMount: transit
  vaultTokenEnv: VAULT_TOKEN
  awsRegion: ""
  azureVaultURL: ""
  azureAlgorithm: "RSA-OAEP-256"
  metadataDSNEnv: PGKMS_METADATA_DSN
  messageBytes: 67108864
  maxConnections: 1024
  dialTimeout: 10s
  clientTLSRequired: true
  authenticationMode: terminate-scram
  clientUsername: application
  clientPasswordEnv: PGKMS_CLIENT_PASSWORD
  upstreamUsername: pg_kms_gateway
  upstreamPasswordEnv: PGKMS_UPSTREAM_PASSWORD
  upstreamDatabase: app

policy: ""

secrets:
  bundleSecretName: pg-kms-gateway-bundle
  bundleKey: bundle.json
  credentialsSecretName: pg-kms-gateway-credentials
  metadataDSNKey: metadata-dsn
  vaultTokenKey: vault-token
  clientPasswordKey: client-password
  upstreamPasswordKey: upstream-password
  clientTLSSecretName: pg-kms-gateway-client-tls
  clientTLSClientCAKey: ""
  upstreamCASecretName: ""

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "2", memory: 1Gi}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: pg-kms-clients
  healthNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring
  dnsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system
  upstreamNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: database
  kmsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: security
  upstreamPort: 5432
  vaultPort: 8200
  allowExternalHTTPS: false
  upstreamCIDRs: []
  kmsCIDRs: []

nodeSelector: {}
tolerations: []
affinity: {}
