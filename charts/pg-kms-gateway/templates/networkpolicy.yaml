{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgkms.fullname" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pgkms.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - {port: 6432, protocol: TCP}
        - {port: 8080, protocol: TCP}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.upstreamNamespaceSelector | nindent 12 }}
      ports:
        - {port: {{ .Values.networkPolicy.upstreamPort }}, protocol: TCP}
    {{- if eq .Values.config.kmsProvider "vault-transit" }}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.kmsNamespaceSelector | nindent 12 }}
      ports:
        - {port: {{ .Values.networkPolicy.vaultPort }}, protocol: TCP}
    {{- end }}
    {{- if .Values.networkPolicy.allowExternalHTTPS }}
    - to:
        - ipBlock: {cidr: "0.0.0.0/0"}
      ports:
        - {port: 443, protocol: TCP}
    {{- end }}
    {{- range .Values.networkPolicy.upstreamCIDRs }}
    - to:
        - ipBlock: {cidr: {{ . | quote }}}
      ports:
        - {port: {{ $.Values.networkPolicy.upstreamPort }}, protocol: TCP}
    {{- end }}
    {{- range .Values.networkPolicy.kmsCIDRs }}
    - to:
        - ipBlock: {cidr: {{ . | quote }}}
      ports:
        - {port: 443, protocol: TCP}
        - {port: {{ $.Values.networkPolicy.vaultPort }}, protocol: TCP}
    {{- end }}
{{- end }}
