apiVersion: v1
kind: Service
metadata:
  name: {{ include "pgkms.fullname" . }}
  labels:
    {{- include "pgkms.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "pgkms.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
    - name: health
      port: 8080
      targetPort: health
