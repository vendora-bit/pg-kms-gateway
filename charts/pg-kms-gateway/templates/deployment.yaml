apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pgkms.fullname" . }}
  labels:
    {{- include "pgkms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pgkms.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pgkms.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "pgkms.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/pgkms/config/config.yaml"]
          ports:
            - {name: postgres, containerPort: 6432, protocol: TCP}
            - {name: health, containerPort: 8080, protocol: TCP}
          env:
            - name: {{ .Values.config.metadataDSNEnv }}
              valueFrom:
                secretKeyRef: {name: {{ .Values.secrets.credentialsSecretName }}, key: {{ .Values.secrets.metadataDSNKey }}}
            {{- if eq .Values.config.kmsProvider "vault-transit" }}
            - name: {{ .Values.config.vaultTokenEnv }}
              valueFrom:
                secretKeyRef: {name: {{ .Values.secrets.credentialsSecretName }}, key: {{ .Values.secrets.vaultTokenKey }}}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe: {httpGet: {path: /readyz, port: health}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /livez, port: health}, periodSeconds: 10, failureThreshold: 3}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/pgkms/config, readOnly: true}
            - {name: policy, mountPath: /etc/pgkms/policy, readOnly: true}
            - {name: bundle, mountPath: /etc/pgkms/bundle, readOnly: true}
            {{- if .Values.secrets.clientTLSSecretName }}
            - {name: client-tls, mountPath: /etc/pgkms/client-tls, readOnly: true}
            {{- end }}
            {{- if .Values.secrets.upstreamCASecretName }}
            - {name: upstream-ca, mountPath: /etc/pgkms/upstream-ca, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ include "pgkms.fullname" . }}, items: [{key: config.yaml, path: config.yaml}]}
        - name: policy
          configMap: {name: {{ include "pgkms.fullname" . }}, items: [{key: policy.yaml, path: policy.yaml}]}
        - name: bundle
          secret: {secretName: {{ .Values.secrets.bundleSecretName }}, items: [{key: {{ .Values.secrets.bundleKey }}, path: bundle.json}]}
        {{- if .Values.secrets.clientTLSSecretName }}
        - name: client-tls
          secret: {secretName: {{ .Values.secrets.clientTLSSecretName }} }
        {{- end }}
        {{- if .Values.secrets.upstreamCASecretName }}
        - name: upstream-ca
          secret: {secretName: {{ .Values.secrets.upstreamCASecretName }} }
        {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
