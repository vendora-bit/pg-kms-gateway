{{- if and .Values.config.clientTLSRequired (not .Values.secrets.clientTLSSecretName) }}
{{- fail "secrets.clientTLSSecretName is required when config.clientTLSRequired=true" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pgkms.fullname" . }}
  labels:
    {{- include "pgkms.labels" . | nindent 4 }}
data:
  config.yaml: |
    listen: ":6432"
    health: ":8080"
    upstream:
      address: {{ .Values.config.upstreamAddress | quote }}
      tls: {{ .Values.config.upstreamTLS }}
      serverName: {{ .Values.config.upstreamServerName | quote }}
      {{- if .Values.secrets.upstreamCASecretName }}
      caFile: /etc/pgkms/upstream-ca/ca.crt
      {{- end }}
    clientTLS:
      required: {{ .Values.config.clientTLSRequired }}
      {{- if .Values.secrets.clientTLSSecretName }}
      certFile: /etc/pgkms/client-tls/tls.crt
      keyFile: /etc/pgkms/client-tls/tls.key
      {{- if .Values.secrets.clientTLSClientCAKey }}
      clientCAFile: /etc/pgkms/client-tls/{{ .Values.secrets.clientTLSClientCAKey }}
      {{- end }}
      {{- end }}
    authentication:
      mode: {{ .Values.config.authenticationMode | quote }}
      {{- if eq .Values.config.authenticationMode "terminate-scram" }}
      clientUsername: {{ required "config.clientUsername is required for terminate-scram" .Values.config.clientUsername | quote }}
      clientPasswordEnv: {{ .Values.config.clientPasswordEnv | quote }}
      upstreamUsername: {{ required "config.upstreamUsername is required for terminate-scram" .Values.config.upstreamUsername | quote }}
      upstreamPasswordEnv: {{ .Values.config.upstreamPasswordEnv | quote }}
      upstreamDatabase: {{ required "config.upstreamDatabase is required for terminate-scram" .Values.config.upstreamDatabase | quote }}
      {{- end }}
    policyFile: /etc/pgkms/policy/policy.yaml
    bundleFile: /etc/pgkms/bundle/bundle.json
    metadataDSNEnv: {{ .Values.config.metadataDSNEnv | quote }}
    kms:
      provider: {{ .Values.config.kmsProvider | quote }}
      keyRef: {{ .Values.config.kmsKeyRef | quote }}
      {{- if eq .Values.config.kmsProvider "vault-transit" }}
      vault:
        address: {{ .Values.config.vaultAddress | quote }}
        mount: {{ .Values.config.vaultMount | quote }}
        tokenEnv: {{ .Values.config.vaultTokenEnv | quote }}
      {{- else if eq .Values.config.kmsProvider "aws-kms" }}
      aws:
        region: {{ required "config.awsRegion is required for aws-kms" .Values.config.awsRegion | quote }}
      {{- else if eq .Values.config.kmsProvider "azure-key-vault" }}
      azure:
        vaultURL: {{ required "config.azureVaultURL is required for azure-key-vault" .Values.config.azureVaultURL | quote }}
        algorithm: {{ .Values.config.azureAlgorithm | quote }}
      {{- end }}
    limits:
      messageBytes: {{ .Values.config.messageBytes }}
      maxConnections: {{ .Values.config.maxConnections }}
      dialTimeout: {{ .Values.config.dialTimeout }}
  policy.yaml: |
    {{- required "policy must be supplied" .Values.policy | nindent 4 }}
